<svg class="uml" viewBox="0 0 900 210" role="img" aria-label="State diagram of whose turn it is" style="--slide-text:#1a1a1a;--slide-muted:#5a5a68;--code-bg:#f4f4f8;--slide-bg:#fff;--sfsu-gold:#c99700;background:#fff;font-family:ui-monospace, Menlo, Consolas, monospace;font-size:15px;fill:var(--slide-text);" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="turn-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="var(--slide-text)" stroke-width="1.6"/></marker>
  <marker id="turn-filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,1 L11,6 L1,11 z" fill="var(--slide-text)"/></marker>
  <marker id="turn-triangle" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,1 L17,9 L1,17 z" fill="var(--slide-bg)" stroke="var(--slide-text)" stroke-width="1.6"/></marker>
  <marker id="turn-hollowdiamond" viewBox="0 0 24 14" refX="23" refY="7" markerWidth="24" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,7 L12,1 L23,7 L12,13 z" fill="var(--slide-bg)" stroke="var(--slide-text)" stroke-width="1.6"/></marker>
  <marker id="turn-filleddiamond" viewBox="0 0 24 14" refX="23" refY="7" markerWidth="24" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,7 L12,1 L23,7 L12,13 z" fill="var(--slide-text)" stroke="var(--slide-text)" stroke-width="1.6"/></marker>
</defs>
<circle cx="60" cy="90" r="11" fill="var(--slide-text)"/>
<line x1="72" y1="90" x2="256" y2="90" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#turn-open)"/>
<text x="160" y="80" text-anchor="middle" style="fill:var(--slide-muted)">new Game()</text>
<rect x="260" y="60" width="190" height="60" rx="22" fill="var(--code-bg)" stroke="var(--slide-text)" stroke-width="1.6"/>
<text x="355.0" y="95.0" text-anchor="middle" style="font-weight:700">WhiteToMove</text>
<rect x="660" y="60" width="190" height="60" rx="22" fill="var(--code-bg)" stroke="var(--slide-text)" stroke-width="1.6"/>
<text x="755.0" y="95.0" text-anchor="middle" style="font-weight:700">BlackToMove</text>
<path d="M420,60 C490,-10 620,-10 690,60" fill="none" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#turn-open)"/>
<text x="555.0" y="40" text-anchor="middle">play(move)</text>
<path d="M690,120 C620,190 490,190 420,120" fill="none" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#turn-open)"/>
<text x="555.0" y="152" text-anchor="middle">play(move)</text>
<line x1="450" y1="80" x2="658" y2="80" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#turn-open)"/>
<line x1="660" y1="100" x2="452" y2="100" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#turn-open)"/>
<text x="555.0" y="74" text-anchor="middle" style="fill:var(--slide-muted)">undoLastMove()</text>
<text x="555.0" y="118" text-anchor="middle" style="fill:var(--slide-muted)">undoLastMove()</text>
</svg>