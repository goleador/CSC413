<svg class="uml" viewBox="0 0 860 490" role="img" aria-label="Sequence diagram of Game.play" style="--slide-text:#1a1a1a;--slide-muted:#5a5a68;--code-bg:#f4f4f8;--slide-bg:#fff;--sfsu-gold:#c99700;background:#fff;font-family:ui-monospace, Menlo, Consolas, monospace;font-size:15px;fill:var(--slide-text);" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="play-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="var(--slide-text)" stroke-width="1.6"/></marker>
  <marker id="play-filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,1 L11,6 L1,11 z" fill="var(--slide-text)"/></marker>
  <marker id="play-triangle" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,1 L17,9 L1,17 z" fill="var(--slide-bg)" stroke="var(--slide-text)" stroke-width="1.6"/></marker>
  <marker id="play-hollowdiamond" viewBox="0 0 24 14" refX="23" refY="7" markerWidth="24" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,7 L12,1 L23,7 L12,13 z" fill="var(--slide-bg)" stroke="var(--slide-text)" stroke-width="1.6"/></marker>
  <marker id="play-filleddiamond" viewBox="0 0 24 14" refX="23" refY="7" markerWidth="24" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1,7 L12,1 L23,7 L12,13 z" fill="var(--slide-text)" stroke="var(--slide-text)" stroke-width="1.6"/></marker>
</defs>
<rect x="53.0" y="20.0" width="74.0" height="37.0" rx="3" fill="var(--code-bg)" stroke="var(--slide-text)" stroke-width="1.6"/>
<text x="90.0" y="45.0" text-anchor="middle" style="font-weight:700">caller</text>
<line x1="90.0" y1="57.0" x2="90.0" y2="479.8" stroke="var(--slide-muted)" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="402.0" y="20.0" width="56.0" height="37.0" rx="3" fill="var(--code-bg)" stroke="var(--slide-text)" stroke-width="1.6"/>
<text x="430.0" y="45.0" text-anchor="middle" style="font-weight:700">Game</text>
<line x1="430.0" y1="57.0" x2="430.0" y2="479.8" stroke="var(--slide-muted)" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="737.5" y="20.0" width="65.0" height="37.0" rx="3" fill="var(--code-bg)" stroke="var(--slide-text)" stroke-width="1.6"/>
<text x="770.0" y="45.0" text-anchor="middle" style="font-weight:700">Board</text>
<line x1="770.0" y1="57.0" x2="770.0" y2="479.8" stroke="var(--slide-muted)" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="424.0" y="117.4" width="12" height="339.3" fill="var(--slide-bg)" stroke="var(--slide-text)" stroke-width="1.4"/>
<rect x="20.0" y="167.4" width="820.0" height="278.4" fill="none" stroke="var(--sfsu-gold)" stroke-width="1.8"/>
<path d="M20.0,191.4 L65.0,191.4 L73.0,180.5 L73.0,167.4" fill="none" stroke="var(--sfsu-gold)" stroke-width="1.8"/>
<text x="26.0" y="184.8" style="font-weight:700">alt</text>
<text x="83.0" y="184.8" style="paint-order:stroke;stroke:var(--slide-bg);stroke-width:6px;stroke-linejoin:round;fill:var(--slide-muted)">[move not in legalMoves()]</text>
<line x1="20.0" y1="245.8" x2="840.0" y2="245.8" stroke="var(--sfsu-gold)" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="26.0" y="264.2" style="fill:var(--slide-muted)">[else]</text>
<text x="260.0" y="86.5" text-anchor="middle" style="paint-order:stroke;stroke:var(--slide-bg);stroke-width:6px;stroke-linejoin:round;">play(move)</text>
<line x1="96.0" y1="93.5" x2="424.0" y2="93.5" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#play-filled)"/>
<text x="480.0" y="138.1" style="paint-order:stroke;stroke:var(--slide-bg);stroke-width:6px;stroke-linejoin:round;">legalMoves()</text>
<path d="M436.0,120.1 L470.0,120.1 L470.0,140.1 L438.0,140.1" fill="none" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#play-filled)"/>
<text x="260.0" y="208.3" text-anchor="middle" style="paint-order:stroke;stroke:var(--slide-bg);stroke-width:6px;stroke-linejoin:round;">throw IllegalArgumentException</text>
<line x1="424.0" y1="215.3" x2="96.0" y2="215.3" stroke="var(--slide-text)" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#play-open)"/>
<text x="600.0" y="280.1" text-anchor="middle" style="paint-order:stroke;stroke:var(--slide-bg);stroke-width:6px;stroke-linejoin:round;">apply(move)</text>
<line x1="436.0" y1="287.1" x2="764.0" y2="287.1" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#play-filled)"/>
<text x="480.0" y="331.7" style="paint-order:stroke;stroke:var(--slide-bg);stroke-width:6px;stroke-linejoin:round;">history.add(move)</text>
<path d="M436.0,313.7 L470.0,313.7 L470.0,333.7 L438.0,333.7" fill="none" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#play-filled)"/>
<text x="480.0" y="375.2" style="paint-order:stroke;stroke:var(--slide-bg);stroke-width:6px;stroke-linejoin:round;">sideToMove = sideToMove.opposite()</text>
<path d="M436.0,357.2 L470.0,357.2 L470.0,377.2 L438.0,377.2" fill="none" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#play-filled)"/>
<text x="260.0" y="410.6" text-anchor="middle" style="paint-order:stroke;stroke:var(--slide-bg);stroke-width:6px;stroke-linejoin:round;">return</text>
<line x1="424.0" y1="417.6" x2="96.0" y2="417.6" stroke="var(--slide-text)" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#play-open)"/>
</svg>