<text x="30.0" y="94.8" style="">-List&lt;Move&gt; history</text>
<text x="30.0" y="116.6" style="">-Color sideToMove</text>
<line x1="20.0" y1="127.0" x2="264.0" y2="127.0" stroke="var(--slide-text)" stroke-width="1.2"/>
<text x="30.0" y="148.3" style="">+legalMoves() List&lt;Move&gt;</text>
<text x="30.0" y="170.1" style="">+play(Move) void</text>
<rect x="470.0" y="40.0" width="406.0" height="112.0" rx="3" fill="var(--code-bg)" stroke="var(--slide-text)" stroke-width="1.6"/>
<text x="673.0" y="62.4" text-anchor="middle" style="font-weight:700;">MoveGenerator</text>
<line x1="470.0" y1="71.8" x2="876.0" y2="71.8" stroke="var(--slide-text)" stroke-width="1.2"/>
