<path d="M640.0,67.4 L291.0,76.1" fill="none" stroke="var(--slide-text)" stroke-width="1.6" marker-end="url(#mvc-open)"/>
<text x="465.5" y="61.8" text-anchor="middle" style="fill:var(--slide-muted)">tells it to redraw</text>
<path d="M291.0,107.7 L640.0,91.4" fill="none" stroke="var(--slide-text)" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#mvc-open)"/>
