<text x="78" y="586" class="cap">Up: a2, a3, then a friend on a4. Stop. a4 is not a move.</text>
<text x="78" y="606" class="cap">Right: b1, c1, d1, then an enemy on e1. Capture, then stop.</text>
<text x="78" y="626" class="cap">Left and down: off the board at once. Five moves in all.</text>
