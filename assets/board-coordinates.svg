<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 584" width="616" height="584" role="img" aria-labelledby="t d">
<title id="t">Board coordinates: files, ranks, and array indices</title>
<desc id="d">An 8 by 8 chessboard. Files run a to h along the bottom, with array indices 0 to 7 directly beneath. Ranks run 8 down to 1 along the left, with array indices 7 down to 0 beside them. Rank 8 is at the top and holds index 7; rank 1 is at the bottom and holds index 0. The square e2 is highlighted, and equals file 4, rank 1.</desc>
<style>
  :root{--ink:#1a1a1a;--muted:#5a5a68;--light:#f0ecf7;--dark:#b9aed6;--edge:#2a1d54;--hl:#c99700;--hlink:#1a1a1a}
  @media (prefers-color-scheme: dark){
    :root{--ink:#f0eef7;--muted:#a9a4bd;--light:#3a3352;--dark:#241f38;--edge:#8b9aff;--hl:#f0b429;--hlink:#14121c}
  }
  text{font-family:'SF Mono',Menlo,Consolas,monospace;fill:var(--ink)}
  .lbl{font-size:19px;font-weight:600}
  .idx{font-size:16px;fill:var(--muted)}
  .cap{font-size:14.5px;fill:var(--muted);font-family:system-ui,-apple-system,sans-serif}
  .hd{font-size:13px;fill:var(--muted);font-family:system-ui,-apple-system,sans-serif;letter-spacing:.07em;text-anchor:end}
</style>
