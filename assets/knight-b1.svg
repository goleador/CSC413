<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 698 678" width="698" height="678" role="img" aria-labelledby="t d">
<title id="t">A knight on b1: eight offsets, three squares on the board</title>
<desc id="d">An 8 by 8 chessboard with a white knight on b1. Eight arrows leave b1, one per knight offset. Three land on the board, on a3, c3 and d2, which are highlighted. The other five point off the board to dashed squares labelled null: two below the board, two to the left, and one below-left.</desc>
<style>
  :root{--ink:#1a1a1a;--muted:#5a5a68;--light:#f0ecf7;--dark:#b9aed6;--edge:#2a1d54;--hl:#c99700;--hlink:#1a1a1a;--bad:#d32f2f}
  @media (prefers-color-scheme: dark){
    :root{--ink:#f0eef7;--muted:#a9a4bd;--light:#3a3352;--dark:#241f38;--edge:#8b9aff;--hl:#f0b429;--hlink:#14121c;--bad:#ff6b6b}
  }
  text{font-family:'SF Mono',Menlo,Consolas,monospace;fill:var(--ink)}
  .lbl{font-size:19px;font-weight:600}
  .sq{font-size:17px;font-weight:600;fill:var(--hlink)}
  .nul{font-size:15px;fill:var(--muted);font-style:italic}
  .cap{font-size:14.5px;fill:var(--muted);font-family:system-ui,-apple-system,sans-serif}
  .glyph{font-family:'Apple Symbols','Segoe UI Symbol','DejaVu Sans',sans-serif;font-size:40px;fill:var(--ink)}
  .arrow{stroke:var(--edge);stroke-width:2.5;fill:none;marker-end:url(#head)}
  .arrow.off{stroke:var(--muted);stroke-dasharray:6 5;marker-end:url(#headoff)}
  .ring{fill:none;stroke-width:4}
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker>
  <marker id="headoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker>
</defs>

